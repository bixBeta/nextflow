name: Build and Push Docker Image

on:
  push:
    branches:
      - g2
      - dev
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_NAME: trex-rna
  REGISTRY_OWNER: bixbeta

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: bixbeta
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.REGISTRY_OWNER }}/${{ env.IMAGE_NAME }}
            bixbeta/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/g2' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-sif:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
      packages: read

    steps:
      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.4

      - name: Log in to GHCR for Apptainer
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login \
            --username ${{ github.actor }} \
            --password-stdin \
            oras://ghcr.io

      - name: Build SIF from Docker image
        run: |
          apptainer build trex-rna_${{ github.ref_name }}.sif \
            docker://ghcr.io/${{ env.REGISTRY_OWNER }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Upload SIF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: trex-rna_${{ github.ref_name }}.sif
          path: trex-rna_${{ github.ref_name }}.sif
          retention-days: 90

      - name: Upload SIF to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: trex-rna_${{ github.ref_name }}.sif
